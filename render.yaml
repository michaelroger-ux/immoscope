# Render (Blueprint) : New → Blueprint → choisir ce dépôt. Même montage que la supervision Workways :
# région Francfort, une seule instance, base SQLite sur un disque persistant.
# Documentation : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: immoscope
    runtime: python
    region: frankfurt
    plan: starter            # le disque persistant demande un plan payant ; pas de mise en veille
    numInstances: 1          # une seule instance : base SQLite et analyses en arrière-plan dans le même processus
    buildCommand: pip install .
    startCommand: uvicorn immoscope.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: immoscope-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: IMMO_DATA_DIR
        value: /data
      - key: IMMO_SECRET_KEY
        generateValue: true
      # Secrets à saisir dans Render au premier déploiement (jamais dans le dépôt) :
      - key: IMMO_PASSWORD       # mot de passe d'accès à l'application
        sync: false
      - key: ANTHROPIC_API_KEY   # analyse des photos par Claude
        sync: false
